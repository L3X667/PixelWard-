<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel War</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #38bdf8;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        #game-screen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Écran de connexion -->
        <div id="login-screen">
            <h1>Pixel War ⚔️</h1>
            <input type="text" id="username" placeholder="Entre ton pseudo..." autocomplete="off">
            <button id="login-btn">Se connecter</button>
        </div>

        <!-- Écran de jeu (masqué par défaut) -->
        <div id="game-screen">
            <h1>Bienvenue, <span id="display-pseudo"></span> !</h1>
            <p>Connecté avec succès au serveur.</p>
            <!-- C'est ici que tu mettras ta grille de pixels par la suite -->
        </div>
    </div>

    <!-- Script Socket.io fourni automatiquement par le serveur -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // Connexion automatique au serveur (marche en local et sur Render)
        const socket = io();

        const loginBtn = document.getElementById('login-btn');
        const usernameInput = document.getElementById('username');
        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const displayPseudo = document.getElementById('display-pseudo');

        loginBtn.addEventListener('click', () => {
            const pseudo = usernameInput.value.trim();

            if (pseudo !== "") {
                // Envoi du pseudo au serveur
                socket.emit('user-login', pseudo);

                // Passage à l'écran de jeu
                loginScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                displayPseudo.textContent = pseudo;
            } else {
                alert("Entre un pseudo valide !");
            }
        });
    </script>
</body>
</html>
