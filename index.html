<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Pixel War</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: white; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
    #map { width: 100%; height: 100%; z-index: 1; }

    .auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: #161b26; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
    .auth-card h2 { text-align: center; font-size: 1.3rem; }
    .auth-card input { background: #0f1117; border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 8px; color: white; outline: none; font-size: 1rem; }
    .auth-card button { background: #6366f1; border: none; padding: 12px; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .auth-card .switch { text-align: center; font-size: 0.85rem; color: #8b949e; cursor: pointer; padding: 4px; }

    .shop-item { background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }

    .leaderboard { position: absolute; top: 16px; left: 16px; z-index: 1000; background: rgba(15, 17, 23, 0.92); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 260px; max-height: 220px; overflow-y: auto; padding: 12px; backdrop-filter: blur(8px); }
    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .vip-user { color: #ffd700 !important; font-weight: bold; text-shadow: 0 0 5px rgba(255,215,0,0.5); }
    .vip-badge { background: linear-gradient(45deg, #ffd700, #ffa500); color: black; font-size: 0.65rem; font-weight: 900; padding: 2px 4px; border-radius: 4px; margin-left: 4px; }
    
    .founder-user { color: #ff0055 !important; font-weight: 900; text-shadow: 0 0 8px #ff0055, 0 0 12px #ff0055; }
    .founder-badge { background: #ff0055; color: white; font-size: 0.65rem; font-weight: 900; padding: 2px 4px; border-radius: 4px; margin-left: 4px; box-shadow: 0 0 6px #ff0055; }

    .neon-user { color: #00ffff !important; text-shadow: 0 0 8px #00ffff; font-weight: bold; }

    /* Barre PC : Bas centre */
    .controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(15, 17, 23, 0.92); padding: 8px 16px; border-radius: 50px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: auto; }
    
    /* Barre Mobile : Droite milieu */
    @media (max-width: 600px) {
      .controls {
        position: absolute !important;
        top: 50% !important;
        right: 15px !important;
        left: auto !important;
        transform: translateY(-50%) !important;
        flex-direction: column !important;
        border-radius: 20px !important;
        padding: 12px 8px !important;
        width: auto !important;
        gap: 12px !important;
      }
    }
    
    .color-picker-wrapper { position: relative; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid #ffffff; cursor: pointer; flex-shrink: 0; }
    .color-picker-wrapper input[type="color"] { position: absolute; top: -10px; left: -10px; width: 60px; height: 60px; border: none; cursor: pointer; background: none; }
    
    .eraser-btn { background: #334155; color: white; border: 2px solid rgba(255,255,255,0.2); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s; flex-shrink: 0; }
    .eraser-btn.active { background: #ef4444; border-color: #fff; box-shadow: 0 0 10px #ef4444; }

    .shop-btn { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    
    .discord-btn { background: #5865F2; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .discord-btn svg { width: 20px; height: 20px; fill: white; }

    .stock { font-weight: bold; font-size: 0.85rem; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 20px; white-space: nowrap; }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <h2 id="modalTitle">Connexion</h2>
      <input type="text" id="usernameInput" placeholder="Pseudo" autocomplete="off" autocapitalize="none">
      <input type="password" id="passwordInput" placeholder="Mot de passe">
      <button id="authBtn" onclick="submitAuth()">Se connecter</button>
      <div class="switch" onclick="toggleAuthMode()" id="switchText">Pas de compte ? S'inscrire</div>
    </div>
  </div>

  <div class="auth-overlay" id="shopModal" style="display: none;">
    <div class="auth-card">
      <h2 style="color: #ffd700;">🛒 Boutique</h2>
      <div class="shop-item">
        <div>
          <b style="color: #ffd700;">Pass VIP</b>
          <p style="font-size:0.75rem; color:#aaa;">Pixels illimités + Badge VIP</p>
        </div>
        <button onclick="payItem('vip', '4.99')" style="background: #ffd700; color: #000; padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">4,99 €</button>
      </div>
      <div class="shop-item">
        <div>
          <b style="color: #00ffff;">+50 Pixels</b>
          <p style="font-size:0.75rem; color:#aaa;">Recharge instantanée</p>
        </div>
        <button onclick="payItem('pixels50', '0.99')" style="background: #00ffff; color: #000; padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">0,99 €</button>
      </div>
      <div id="paypal-button-container" style="margin-top: 10px;"></div>
      <button onclick="closeShop()" style="background: #333; margin-top: 10px;">Fermer</button>
    </div>
  </div>

  <div class="leaderboard">
    <div style="font-weight:bold; margin-bottom:6px; font-size:0.75rem; text-transform:uppercase; color:#8b949e;">Joueurs en ligne</div>
    <div id="playerList"></div>
  </div>

  <div id="map"></div>

  <div class="controls">
    <div class="color-picker-wrapper" id="colorWrapper" style="background-color: #ff0000;">
      <input type="color" id="colorPicker" value="#ff0000">
    </div>
    <button class="eraser-btn" id="eraserBtn" onclick="toggleEraser()" title="Gomme">🧹</button>
    <div class="stock"><span id="stockDisplay">0</span></div>
    <button class="shop-btn" onclick="openShop()">🛒 VIP</button>
    <a href="https://discord.gg/DbHsGBckyc" target="_blank" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a73.57,73.57,0,0,0,64.32,0c.87.68,1.76,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
    </a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=BAAaSvh7KZein4G8C_AEJJhdNFRTTPTTudO-inRIIeYHkujHstULdArocEzSO9-w5Vfy5-hwHhRjs12pz0&currency=EUR&disable-funding=card"></script>
  
  <script>
    let isRegisterMode = false, currentUser = null, socket = null;
    const GRID_SIZE = 0.0005;
    let selectedColor = '#ff0000', isEraser = false, players = {}, renderedPixels = {};

    const map = L.map('map', { zoomControl: false, tap: false }).setView([48.8566, 2.3522], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    document.getElementById('colorPicker').addEventListener('input', (e) => {
      selectedColor = e.target.value;
      document.getElementById('colorWrapper').style.backgroundColor = selectedColor;
      if (isEraser) toggleEraser();
    });

    function toggleEraser() {
      isEraser = !isEraser;
      document.getElementById('eraserBtn').classList.toggle('active', isEraser);
    }

    function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modalTitle').textContent = isRegisterMode ? 'Inscription' : 'Connexion';
      document.getElementById('authBtn').textContent = isRegisterMode ? "S'inscrire" : 'Se connecter';
      document.getElementById('switchText').textContent = isRegisterMode ? 'Déjà un compte ? Se connecter' : "Pas de compte ? S'inscrire";
    }

    async function submitAuth() {
      const username = document.getElementById('usernameInput').value;
      const password = document.getElementById('passwordInput').value;
      const endpoint = isRegisterMode ? '/api/register' : '/api/login';
      const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (!res.ok) return alert(data.error);
      currentUser = data.user;
      document.getElementById('authModal').style.display = 'none';
      initGame();
    }

    function initGame() {
      socket = io();
      socket.emit('joinGame', currentUser);

      socket.on('init', (data) => {
        if (data.user) {
          currentUser = data.user;
        }
        updateStockUI();
        
        Object.keys(data.pixels).forEach(k => {
          if (data.pixels[k].color && !renderedPixels[k]) {
            drawPixel(k, data.pixels[k].bounds, data.pixels[k].color);
          }
        });
        renderLeaderboard();
      });

      socket.on('updatePlayers', p => { players = p; renderLeaderboard(); });
      
      socket.on('pixelPlaced', d => {
        if (!d.color) removePixel(d.key);
        else drawPixel(d.key, d.bounds, d.color);
      });
      
      socket.on('updateStock', d => { currentUser.stock = d.stock; updateStockUI(); });
      socket.on('errorMsg', msg => alert(msg));
    }

    function payItem(item, price) {
      document.getElementById('paypal-button-container').innerHTML = '';
      paypal.Buttons({
        fundingSource: paypal.FUNDING.PAYPAL,
        style: { layout: 'vertical', color: 'gold', shape: 'rect' },
        createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: price } }] }),
        onApprove: (data, actions) => actions.order.capture().then(async () => {
          const res = await fetch('/api/buy-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username, item })
          });
          const dataRes = await res.json();
          if(dataRes.success) {
            alert('Achat réussi !');
            location.reload();
          }
        })
      }).render('#paypal-button-container');
    }

    function drawPixel(key, bounds, color) {
      if (renderedPixels[key]) map.removeLayer(renderedPixels[key]);

      let fillColor = color;
      // Gestion de la couleur Rainbow pour L3X et Zozo_667
      if (color === 'rainbow') {
        const rainbowColors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#8b00ff'];
        fillColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
      }

      renderedPixels[key] = L.rectangle(bounds, { color: fillColor, fillColor: fillColor, fillOpacity: 0.9, stroke: false }).addTo(map);
    }

    function removePixel(key) {
      if (renderedPixels[key]) {
        map.removeLayer(renderedPixels[key]);
        delete renderedPixels[key];
      }
    }

    function updateStockUI() {
      document.getElementById('stockDisplay').textContent = (currentUser.isVip || currentUser.isFounder) ? '∞ VIP' : `Pixels: ${currentUser.stock}`;
    }

    map.on('click', (e) => {
      if (!socket) return;
      const lat = Math.floor(e.latlng.lat / GRID_SIZE) * GRID_SIZE;
      const lng = Math.floor(e.latlng.lng / GRID_SIZE) * GRID_SIZE;
      socket.emit('placePixel', {
        key: `${lat.toFixed(5)},${lng.toFixed(5)}`,
        bounds: [[lat, lng], [lat + GRID_SIZE, lng + GRID_SIZE]],
        color: isEraser ? null : selectedColor
      });
    });

    function renderLeaderboard() {
      const list = Object.values(players).sort((a,b) => b.score - a.score);
      document.getElementById('playerList').innerHTML = list.map(p => {
        let nameClass = p.isFounder ? 'founder-user' : (p.isVip ? 'vip-user' : (p.hasNeon ? 'neon-user' : ''));
        let badge = p.isFounder ? '<span class="founder-badge">FONDATEUR</span>' : (p.isVip ? '<span class="vip-badge">VIP</span>' : '');
        return `<div class="player-row ${nameClass}"><span>${p.name} ${badge}</span><span>${p.score}</span></div>`;
      }).join('');
    }
  </script>
</body>
</html>
